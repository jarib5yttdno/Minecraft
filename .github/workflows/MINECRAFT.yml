name: Minecraft Server on GitHub

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale Auth key"
        required: true
      version:
        description: "Minecraft Version (e.g. 1.20.4)"
        required: false
        default: "1.20.4"

jobs:
  minecraft:
    runs-on: ubuntu-latest # Linux is faster and uses less RAM than Windows for servers
    timeout-minutes: 360

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ---------------- TAILSCALE ----------------
    - name: Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ inputs.ts_authkey }}
        hostname: "mc-server"

    # ---------------- JAVA SETUP ----------------
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # ---------------- SERVER SETUP ----------------
    - name: Download and Run Minecraft
      run: |
        # Create server directory
        mkdir mc_server && cd mc_server
        
        # Download PaperMC (High performance server)
        # Note: You can replace this URL with a specific version or a modded jar
        curl -o server.jar https://api.papermc.io/v2/projects/paper/versions/${{ github.event.inputs.version }}/builds/latest/downloads/paper-${{ github.event.inputs.version }}-latest.jar
        
        # Accept EULA
        echo "eula=true" > eula.txt
        
        # Get Tailscale IP for the logs
        TS_IP=$(tailscale ip -4)
        echo "------------------------------------------------"
        echo "SERVER STARTING AT: $TS_IP"
        echo "------------------------------------------------"

        # Start Server with 6GB RAM (GitHub runners usually have 7GB total)
        java -Xmx6G -Xms6G -jar server.jar nogui
