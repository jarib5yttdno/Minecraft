name: Official Minecraft Server

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale Auth key"
        required: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6-hour limit

    steps:
    - name: Setup Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ inputs.ts_authkey }}
        hostname: "mc-host"

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21' # Required for modern Minecraft versions

    - name: Download & Start Server
      run: |
        mkdir server && cd server
        
        # Download the specific jar you provided
        curl -o server.jar https://piston-data.mojang.com/v1/objects/64bb6d763bed0a9f1d632ec347938594144943ed/server.jar
        
        # Accept EULA (Mandatory)
        echo "eula=true" > eula.txt
        
        # Get your Tailscale IP to show in the logs
        echo "------------------------------------------------"
        echo "SERVER IP: $(tailscale ip -4)"
        echo "------------------------------------------------"
        
        # Launch with 6GB RAM
        # -Xmx6G sets the maximum memory
        java -Xmx6G -Xms6G -jar server.jar nogui
